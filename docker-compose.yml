services:
  db:
    image: mysql:8
    container_name: itc_guard_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${DB_NAME:-itc_guard}
      MYSQL_USER: ${DB_USER:-itc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-itc_dev_password}
    ports:
      # Host 3306 is taken by a native MySQL install — expose on 3307 instead.
      # Containers on this network still reach MySQL on 3306.
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  api:
    build: ./api
    container_name: itc_guard_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # In-network the db service listens on its own 3306 — the 3307 mapping
      # is a host-side concern only.
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: ${DB_USER:-itc}
      DB_PASSWORD: ${DB_PASSWORD:-itc_dev_password}
      DB_NAME: ${DB_NAME:-itc_guard}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-development}
      # Per-visitor workspaces, exactly as the deployed site runs: each browser
      # gets its own empty workspace through a cookie, and "Clear all data"
      # empties it. DEMO_TENANCY=off in .env goes back to one stubbed trader on
      # org 1 (what npm run demo:reset seeds).
      DEMO_TENANCY: ${DEMO_TENANCY:-on}
      # Signs the session cookie, so a workspace survives an api restart. This
      # default is for a local run only: docker-compose.prod.yml requires its own.
      DEMO_SESSION_SECRET: ${DEMO_SESSION_SECRET:-local-dev-only-not-a-secret}
      DEMO_COOKIE_SECURE: ${DEMO_COOKIE_SECURE:-false}
      DEMO_SESSION_DAYS: ${DEMO_SESSION_DAYS:-180}
      DEMO_MAX_ORGS: ${DEMO_MAX_ORGS:-40}
      DEMO_IDLE_MINUTES: ${DEMO_IDLE_MINUTES:-180}
      DEMO_RETAIN_DAYS: ${DEMO_RETAIN_DAYS:-30}
      # Blank means the engine default. See .env.example.
      MATERIALITY_TOLERANCE_PAISE: ${MATERIALITY_TOLERANCE_PAISE:-}
      # Supplier email (services/supplierEmail.js, services/mailInbox.js). Blank
      # SMTP_* leaves the Email button a mailto link and starts no IMAP poller.
      # Values come from the env file only and are never logged.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      IMAP_HOST: ${IMAP_HOST:-}
      EMAIL_ALLOWLIST: ${EMAIL_ALLOWLIST:-}
      # Reply checking; blank key = replies shown unchecked.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      # Supplier WhatsApp through Meta's Cloud API (services/supplierWhatsapp.js,
      # services/whatsappWebhook.js). Blank token, phone number id or template
      # name leaves the WhatsApp button a wa.me link. Never logged.
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-}
      WHATSAPP_FIRST_MESSAGE: ${WHATSAPP_FIRST_MESSAGE:-}
      WHATSAPP_ALLOWLIST: ${WHATSAPP_ALLOWLIST:-}
      WHATSAPP_GRAPH_VERSION: ${WHATSAPP_GRAPH_VERSION:-}
    ports:
      - "3000:3000"
    volumes:
      - ./api/src:/app/src
      - ./docs:/app/docs:ro
      # Read-only: the "Load sample data" button seeds from these.
      - ./fixtures:/app/fixtures:ro
      # The committed risk model. src/risk/score.js reads ml/model.json at
      # runtime; without this the API silently serves the phase 7 hand-weighted
      # fallback instead, which is correct behaviour but not the intended one.
      # Mounted rather than baked because the build context is ./api and ml/ is
      # its sibling — same reason fixtures/ is mounted.
      - ./ml:/app/ml:ro

  web:
    build: ./web
    container_name: itc_guard_web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # Vite proxies /api here (see web/vite.config.js).
      VITE_API_BASE: http://api:3000
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/src
      - ./web/index.html:/app/index.html
      # The proxy table lives here; without the mount an edit needs a rebuild.
      - ./web/vite.config.js:/app/vite.config.js
      # Tests too, so `docker compose exec web npm test` picks up edits directly.
      # package.json stays baked in: a dependency change needs a rebuild anyway.
      - ./web/vitest.config.js:/app/vitest.config.js
      - ./web/test:/app/test

volumes:
  db_data:
